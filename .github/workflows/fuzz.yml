name: Fuzz

# Daily fuzz run for the cargo-fuzz harnesses under fuzz/. The reusable
# workflow auto-discovers fuzz/fuzz_targets/*.rs and splits the time
# budget evenly across them:
#
#   * decode_tga — attacker-supplied bytes through the contract API
#     (`probe` / `info` / `header` / `decode` / `decode_with` under a
#     byte limit and in strict mode / `decode_rgb8` / `decode_rgba8`),
#     every structural `parse_tga_*` reader (footer / extension area /
#     postage stamp / §C.6.8 CCT / §C.6.9 scan-line table / §C.7
#     developer area / Image ID / colour map) and the §C.6 display
#     pipeline. Decoder-only panic-free contract.
#   * contract_identity — `decode(encode(img)) == img` for every native
#     layout (`Rgba` / `Rgb24` / `Gray8` / `Pal8` + palette) across the
#     lossless `EncodeOptions` axes (rle, row order, alpha bits, Image
#     ID, screen origin, footer, gamma), plus `probe` / `info`
#     agreement on the encoder's own output.
#   * roundtrip_identity / encode_roundtrip — the pre-contract writers
#     (deprecated wrappers, byte-identical) through the decoder:
#     bit-exact identity for the lossless ones, frame shape for all.
#   * extension_roundtrip — `encode_tga_with_extension` offset
#     back-patch arithmetic re-read through the extension-area readers.
#
# No external oracle is reachable (the clean-room wall bars third-party
# TGA implementations), so no target compares pixels against another
# decoder: the identity targets compare against a locally computed
# expectation and decode_tga is purely panic-free.

on:
  schedule:
    - cron: "31 5 * * *"   # daily 05:31 UTC, jittered off the hour
  workflow_dispatch:

jobs:
  fuzz:
    uses: OxideAV/.github/.github/workflows/crate-fuzz.yml@master
    with:
      time_budget_seconds: 1800
    secrets: inherit
